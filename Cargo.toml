[workspace]
resolver = "3"
members = ["crates/schema", "crates/search", "crates/content-compiler", "crates/web", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/phynics/cast-iron"
publish = false

[workspace.dependencies]
cast-iron-schema = { path = "crates/schema" }
cast-iron-search = { path = "crates/search" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
futures = "0.3"
send_wrapper = "0.6"
postcard = { version = "1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# Line tables keep panic locations and backtraces; dropping full debug info
# cuts each worktree's target/ by about a third.
[profile.dev]
debug = "line-tables-only"

# Native tools run on full corpus data; keep them fast in debug builds.
[profile.dev.package."*"]
opt-level = 2
debug = false
