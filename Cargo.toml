[workspace]
resolver = "3"
members = ["crates/schema", "crates/search", "crates/content-compiler", "crates/web", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/phynics/cast-iron"
publish = false

[workspace.dependencies]
cast-iron-schema = { path = "crates/schema" }
cast-iron-search = { path = "crates/search" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
postcard = { version = "1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# Native tools run on full corpus data; keep them fast in debug builds.
[profile.dev.package."*"]
opt-level = 2
