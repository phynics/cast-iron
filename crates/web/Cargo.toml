[package]
name = "cast-iron-web"
description = "Leptos client application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cast_iron_web"
path = "src/lib.rs"

[[bin]]
name = "cast-iron-web"
path = "src/main.rs"

[dependencies]
cast-iron-schema.workspace = true
cast-iron-search.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
futures.workspace = true
send_wrapper.workspace = true

[dependencies.web-sys]
workspace = true
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlBaseElement", "Location", "History",
  "Navigator", "Storage", "Event", "EventTarget", "HashChangeEvent", "ScrollToOptions",
  "ScrollBehavior", "ServiceWorker", "ServiceWorkerContainer", "MessageChannel", "MessagePort",
  "Cache", "CacheStorage", "CacheQueryOptions", "Request", "RequestInit", "RequestCache",
  "Response", "ResponseInit", "Headers", "AbortSignal",
  "IdbDatabase", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "IdbRequest",
  "IdbOpenDbRequest", "IdbObjectStoreParameters", "FocusOptions", "IdbKeyRange", "DomException", "MediaQueryList", "DomTokenList",
  "Performance", "KeyboardEvent", "HtmlInputElement", "HtmlDetailsElement", "Blob", "File", "FileList", "HtmlAnchorElement", "Url",
]

[lints]
workspace = true
