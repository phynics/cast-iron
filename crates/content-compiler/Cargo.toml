[package]
name = "cast-iron-content-compiler"
description = "Compiles upstream datasets into versioned Cast Iron content"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "cast-iron-compile"
path = "src/main.rs"

[[bin]]
name = "cast-iron-data"
path = "src/data_main.rs"

[dependencies]
cast-iron-corpus.workspace = true
cast-iron-schema.workspace = true
cast-iron-search.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
scraper = "0.29"
toml = "0.9"
unicode-normalization = "0.1"
pulldown-cmark = "0.13"

[lints]
workspace = true
