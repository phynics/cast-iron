name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.22.1"
  # SHA-256 of trunk-x86_64-unknown-linux-gnu.tar.gz in the v0.22.1 release
  # (the release publishes it as trunk-x86_64-unknown-linux-gnu.tar.gz.sha256).
  TRUNK_SHA256: 2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Release promotion safety checks
        run: python3 scripts/test-promote-release.py
      - name: cargo xtask check
        run: cargo xtask check

  content:
    name: Content compiler and determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned dataset commits
        id: pin
        run: |
          echo "commit=$(sed -n 's/^commit *= *"\(.*\)"/\1/p' sources/psrd-data/source.toml)" >> "$GITHUB_OUTPUT"
          echo "primary=$(python3 -c 'import json; print(json.load(open("sources/pathfinder-data-1-e/source.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/sources
          key: psrd-data-${{ steps.pin.outputs.commit }}-pf-${{ steps.pin.outputs.primary }}
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask fetch-sources
      - run: cargo xtask content
      - name: Hash the first compile
        id: first
        run: echo "hash=$(find generated -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Compile again from scratch
        run: |
          rm -rf generated
          cargo xtask content
      - name: Compiler output must be byte-identical (NFR-05)
        run: |
          second=$(find generated -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "first : ${{ steps.first.outputs.hash }}"
          echo "second: $second"
          test "$second" = "${{ steps.first.outputs.hash }}"
      - name: Audit the complete pinned primary input and representative conversion
        run: |
          cargo xtask data-report
          git diff --exit-code -- reports/migration-coverage.json reports/migration-test.json reports/migration-test.md
      - uses: actions/upload-artifact@v7
        with:
          name: generated
          path: generated
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: content-reports
          path: generated/reports
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: Browser acceptance tests
    # Browser signal must not disappear when formatting, clippy, or unit tests fail.
    needs: [content]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: generated
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk ${{ env.TRUNK_VERSION }}
        run: |
          asset="trunk-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/${asset}"
          echo "${TRUNK_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf "$RUNNER_TEMP/$asset" -C "$HOME/.local/bin" trunk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the site
        run: |
          trunk --version
          cargo xtask build-site --public-url /cast-iron/
      - name: Screen the publication scope and attribution
        run: python3 scripts/check-publication.py
      - name: Dist size summary
        run: |
          {
            echo "### dist size"
            echo '```'
            du -sh dist
            du -sh dist/content
            find dist -maxdepth 1 -type f -printf '%s\t%f\n' | sort -rn | head -10
            echo '```'
          } | tee dist-size.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm --prefix tests/e2e ci
      - name: Install Chromium and its system dependencies
        run: npx --prefix tests/e2e playwright install --with-deps chromium
      - name: Tests on Chromium (required)
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/chromium
        run: npm --prefix tests/e2e test -- --project=chromium --project=mobile-chromium --output=test-results/chromium
      - name: Install WebKit
        if: ${{ !cancelled() }}
        run: npx --prefix tests/e2e playwright install --with-deps webkit
      # Firefox is disabled in CI after repeated installer timeouts; see docs/decisions.md.
      # WebKit remains informational until its service worker behavior is stable on Linux.
      - name: Tests on WebKit (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/webkit
        run: npm --prefix tests/e2e test -- --project=webkit --output=test-results/webkit
      - name: Upload the report, traces and dist size
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            dist-size.txt
          if-no-files-found: warn
          retention-days: 14
