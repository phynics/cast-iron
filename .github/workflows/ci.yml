name: CI

# Pull requests run only the Rust checks. The full pipeline (content compile and
# determinism, site build, browser shards) runs on main once a day and on demand; see
# docs/decisions.md. Release promotion needs a successful full run for the exact
# main commit, so start one with `gh workflow run ci.yml --ref main` if needed.
on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The browser jobs run in a container whose tag repeats the Playwright version.
      # A lock-file bump that leaves the tag behind would test a different browser
      # build than the package the suite runs, so fail before anything else.
      - name: Playwright image tag matches the lock file
        shell: bash
        run: |
          lock=$(jq -er '.packages["node_modules/@playwright/test"].version' tests/e2e/package-lock.json)
          image=$(sed -n 's|.*mcr\.microsoft\.com/playwright:v\([0-9][0-9.]*\)-noble.*|\1|p' .github/workflows/ci.yml | sort -u)
          echo "lock file: $lock"
          echo "image tag: $image"
          test -n "$image" && test "$image" = "$lock"
      # The tests read the pinned corpus (the Books tier table is checked against its
      # categories), and the test fails in CI when it is missing. The cache is keyed on the
      # pinned commit, like the content job's.
      - name: Read the pinned corpus commit
        id: pin
        run: echo "corpus=$(sed -n 's/^commit *= *"\(.*\)"/\1/p' sources/corpus.toml)" >> "$GITHUB_OUTPUT"
      - name: Restore the pinned corpus
        id: corpus
        uses: actions/cache/restore@v6
        with:
          path: .cache/sources/cast-iron-data
          key: cast-iron-data-${{ steps.pin.outputs.corpus }}
      - uses: ./.github/actions/setup-build
        with:
          cache-key: check
      - run: cargo xtask fetch-sources
      - name: Save the pinned corpus
        if: ${{ steps.corpus.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/sources/cast-iron-data
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - name: Release promotion safety checks
        run: python3 scripts/test-promote-release.py
      - name: cargo xtask check
        run: cargo xtask check

  content:
    name: Content compiler
    # The full pipeline runs on main only (daily or on demand). Every later job
    # needs this one, so they are skipped on pull requests as well.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned corpus commit
        id: pin
        run: echo "corpus=$(sed -n 's/^commit *= *"\(.*\)"/\1/p' sources/corpus.toml)" >> "$GITHUB_OUTPUT"
      # The plain-text corpus has its own cache, keyed on the pinned commit.
      # `fetch-sources` still verifies the tree hash of whatever it finds.
      - name: Restore the pinned corpus
        id: corpus
        uses: actions/cache/restore@v6
        with:
          path: .cache/sources/cast-iron-data
          key: cast-iron-data-${{ steps.pin.outputs.corpus }}
      - uses: ./.github/actions/setup-build
        with:
          cache-key: content
      - run: cargo xtask fetch-sources
      # Save before the compile, which a failure would skip.
      - name: Save the pinned corpus
        if: ${{ steps.corpus.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/sources/cast-iron-data
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      # The library is compiled from the pinned plain-text corpus into generated/content.
      - run: cargo xtask content
      - uses: actions/upload-artifact@v7
        with:
          name: generated
          path: generated
          # The determinism job compares every file, so a dotfile must not drop out.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: content-reports
          path: generated/reports
          if-no-files-found: error
          retention-days: 30

  # The second compile of the determinism check. It compares its own output with the
  # artifact of the content job. Nothing waits for it, so it runs beside the site build
  # and the browser shards instead of before them.
  determinism:
    name: Content determinism (NFR-05)
    needs: [content]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned corpus commit
        id: pin
        run: echo "corpus=$(sed -n 's/^commit *= *"\(.*\)"/\1/p' sources/corpus.toml)" >> "$GITHUB_OUTPUT"
      - name: Restore the pinned corpus
        uses: actions/cache/restore@v6
        with:
          path: .cache/sources/cast-iron-data
          key: cast-iron-data-${{ steps.pin.outputs.corpus }}
      - uses: ./.github/actions/setup-build
        with:
          cache-key: content
      - run: cargo xtask fetch-sources
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: first
      - name: Compile the library again from scratch
        run: |
          rm -rf generated
          cargo xtask content
      - name: Output must be byte-identical (NFR-05)
        run: diff -r --brief first generated

  site:
    name: Build the site
    # Browser signal must not disappear when formatting, clippy, or unit tests fail.
    needs: [content]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: generated
      - uses: ./.github/actions/setup-build
        id: setup
        with:
          cache-key: site
          trunk: "true"
      - name: Build the site
        run: |
          trunk --version
          # Trunk fetches wasm-bindgen and wasm-opt from GitHub on a cold tools cache.
          for attempt in 1 2 3; do
            cargo xtask build-site --public-url /cast-iron/ && exit 0
            echo "::warning::build-site attempt $attempt failed"
            sleep 10
          done
          exit 1
      # Directly after the build, which downloads the tools. The later checks
      # cannot skip this save.
      - name: Save Trunk's downloaded tools
        if: ${{ steps.setup.outputs.trunk-tools-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/trunk
          key: ${{ steps.setup.outputs.trunk-tools-key }}
      - name: Screen the publication scope and attribution
        run: python3 scripts/check-publication.py
      - name: Dist size summary
        run: |
          {
            echo "### dist size"
            echo '```'
            du -sh dist
            du -sh dist/content
            find dist -maxdepth 1 -type f -printf '%s\t%f\n' | sort -rn | head -10
            echo '```'
          } | tee dist-size.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist
            dist-size.txt
          # dist holds .nojekyll, which the browser tests load as published.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      # The dist artifact only bridges jobs; the size record keeps the old 14-day retention.
      - uses: actions/upload-artifact@v7
        with:
          name: dist-size
          path: dist-size.txt
          if-no-files-found: error
          retention-days: 14

  # Each browser runs as a matrix of shards. A shard has its own runner, test
  # server and browser state, so the suite's single worker assumption holds inside
  # it (`workers: 1` in playwright.config.ts). Playwright splits its test groups
  # by test count, and equal shards are not equal in time. The Chromium weights
  # below move short tests to shard 1, whose files are the cheapest; the sizing
  # and the measurements are in docs/decisions.md.
  e2e-chromium:
    name: Chromium shard ${{ matrix.shard }}/3 (required)
    needs: [site]
    runs-on: ubuntu-latest
    # The image carries the Playwright version's browsers and system libraries, so
    # the job installs neither. Keep its tag equal to the lock file (checked by the
    # Rust job). Longest recent successful shard: 6m30s.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 20
    strategy:
      # Let every shard finish, so the merged report shows all failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: generated
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      - uses: ./.github/actions/setup-e2e
      # Chromium and the 390 px mobile project gate CI. Every shard is required.
      - name: Tests on Chromium (required)
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
          # Playwright's shard weights, one per shard. Shard 3 carries the update
          # suite, the mobile project and the slower search tests, so give it a
          # smaller share and shard 1 a larger one (see docs/decisions.md).
          PWTEST_SHARD_WEIGHTS: "6:4:3"
        run: >-
          npm --prefix tests/e2e test --
          --project=chromium --project=mobile-chromium
          --shard=${{ matrix.shard }}/3
          --reporter=list,github,blob
          --output=test-results/chromium-${{ matrix.shard }}
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-chromium-${{ matrix.shard }}
          path: tests/e2e/blob-report
          if-no-files-found: warn
          retention-days: 3

  e2e-webkit:
    name: WebKit shard ${{ matrix.shard }}/3 (informational)
    needs: [site]
    runs-on: ubuntu-latest
    # WebKit remains informational until its service worker behavior is stable on
    # Linux. A job-level continue-on-error keeps a failure in any shard from
    # failing the workflow run, which scripts/promote-release.py reads. Firefox is
    # disabled in CI after repeated installer timeouts; see docs/decisions.md.
    continue-on-error: true
    # Same container as the Chromium jobs: the image carries the browser and its
    # system libraries, which removes the apt step that used to stall.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # Longest normal successful shard: 7m16s.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: generated
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      - uses: ./.github/actions/setup-e2e
      - name: Tests on WebKit (informational)
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
        run: >-
          npm --prefix tests/e2e test --
          --project=webkit
          --shard=${{ matrix.shard }}/3
          --reporter=list,github,blob
          --output=test-results/webkit-${{ matrix.shard }}
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-webkit-${{ matrix.shard }}
          path: tests/e2e/blob-report
          if-no-files-found: warn
          retention-days: 3

  # One HTML report per browser, merged from the shard blobs. The blobs carry the
  # traces and screenshots of failed tests. These jobs only publish; they must not
  # decide the run result, so they are informational and a failing shard does not
  # stop them.
  report-chromium:
    name: Chromium report
    needs: [e2e-chromium]
    if: ${{ !cancelled() && needs.e2e-chromium.result != 'skipped' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/merge-e2e-reports
        with:
          browser: chromium

  report-webkit:
    name: WebKit report
    needs: [e2e-webkit]
    if: ${{ !cancelled() && needs.e2e-webkit.result != 'skipped' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/merge-e2e-reports
        with:
          browser: webkit
