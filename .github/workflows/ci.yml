name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          cache-key: check
      - name: Release promotion safety checks
        run: python3 scripts/test-promote-release.py
      - name: cargo xtask check
        run: cargo xtask check

  content:
    name: Content compiler and determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned dataset commits
        id: pin
        run: |
          echo "commit=$(sed -n 's/^commit *= *"\(.*\)"/\1/p' sources/psrd-data/source.toml)" >> "$GITHUB_OUTPUT"
          echo "primary=$(python3 -c 'import json; print(json.load(open("sources/pathfinder-data-1-e/source.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - name: Restore the pinned datasets
        id: sources
        uses: actions/cache/restore@v6
        with:
          path: .cache/sources
          key: psrd-data-${{ steps.pin.outputs.commit }}-pf-${{ steps.pin.outputs.primary }}
      - uses: ./.github/actions/setup-build
        with:
          cache-key: content
      - run: cargo xtask fetch-sources
      # Save before the compile and determinism checks, which a failure would skip.
      - name: Save the pinned datasets
        if: ${{ steps.sources.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/sources
          key: ${{ steps.sources.outputs.cache-primary-key }}
      # The canonical library is the default build (generated/content).
      - run: cargo xtask content
      - name: Hash the first canonical compile
        id: first
        run: echo "hash=$(find generated -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Compile the canonical default again from scratch
        run: |
          rm -rf generated
          cargo xtask content
      - name: Canonical output must be byte-identical (NFR-05)
        run: |
          second=$(find generated -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "first : ${{ steps.first.outputs.hash }}"
          echo "second: $second"
          test "$second" = "${{ steps.first.outputs.hash }}"
      # PSRD-Data is no longer the default, but it remains the carry-over input
      # and the previous published library. Its build must stay deterministic.
      - name: Compile the PSRD carry-over library
        run: cargo xtask content --psrd
      - name: Hash the first PSRD compile
        id: psrd-first
        run: echo "hash=$(find generated/psrd generated/reports/psrd -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Compile the PSRD carry-over library again from scratch
        run: |
          rm -rf generated/psrd generated/reports/psrd
          cargo xtask content --psrd
      - name: PSRD output must be byte-identical
        run: |
          second=$(find generated/psrd generated/reports/psrd -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "first : ${{ steps.psrd-first.outputs.hash }}"
          echo "second: $second"
          test "$second" = "${{ steps.psrd-first.outputs.hash }}"
      - name: The default library resolves every previous PSRD id
        run: python3 scripts/check-library-upgrade.py generated/psrd generated/content
      - name: Audit the complete pinned primary input and representative conversion
        run: |
          cargo xtask data-report
          git diff --exit-code -- reports/migration-coverage.json reports/migration-legal.json reports/migration-test.json reports/migration-test.md
      - uses: actions/upload-artifact@v7
        with:
          name: generated
          path: generated
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: content-reports
          path: generated/reports
          if-no-files-found: error
          retention-days: 30

  site:
    name: Build the site
    # Browser signal must not disappear when formatting, clippy, or unit tests fail.
    needs: [content]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: generated
      - uses: ./.github/actions/setup-build
        id: setup
        with:
          cache-key: site
          trunk: "true"
      - name: Build the site
        run: |
          trunk --version
          # Trunk fetches wasm-bindgen and wasm-opt from GitHub on a cold tools cache.
          for attempt in 1 2 3; do
            cargo xtask build-site --public-url /cast-iron/ && exit 0
            echo "::warning::build-site attempt $attempt failed"
            sleep 10
          done
          exit 1
      # Directly after the build, which downloads the tools. The later checks
      # cannot skip this save.
      - name: Save Trunk's downloaded tools
        if: ${{ steps.setup.outputs.trunk-tools-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/trunk
          key: ${{ steps.setup.outputs.trunk-tools-key }}
      - name: Screen the publication scope and attribution
        run: python3 scripts/check-publication.py
      - name: Dist size summary
        run: |
          {
            echo "### dist size"
            echo '```'
            du -sh dist
            du -sh dist/content
            find dist -maxdepth 1 -type f -printf '%s\t%f\n' | sort -rn | head -10
            echo '```'
          } | tee dist-size.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist
            dist-size.txt
          # dist holds .nojekyll, which the browser tests load as published.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      # The dist artifact only bridges jobs; the size record keeps the old 14-day retention.
      - uses: actions/upload-artifact@v7
        with:
          name: dist-size
          path: dist-size.txt
          if-no-files-found: error
          retention-days: 14

  # Each browser runs as a matrix of shards. A shard has its own runner, test
  # server and browser state, so the suite's single worker assumption holds inside
  # it (`workers: 1` in playwright.config.ts). Playwright splits whole spec files
  # across shards by test count. The shard count is chosen so that every shard's
  # test step takes about 4-5 minutes; the sizing is in docs/decisions.md.
  e2e-chromium:
    name: Chromium shard ${{ matrix.shard }}/3 (required)
    needs: [site]
    runs-on: ubuntu-latest
    strategy:
      # Let every shard finish, so the merged report shows all failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: generated
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      - uses: ./.github/actions/setup-e2e
        with:
          browser: chromium
      # Chromium and the 390 px mobile project gate CI. Every shard is required.
      - name: Tests on Chromium (required)
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
        run: >-
          npm --prefix tests/e2e test --
          --project=chromium --project=mobile-chromium
          --shard=${{ matrix.shard }}/3
          --reporter=list,github,blob
          --output=test-results/chromium-${{ matrix.shard }}
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-chromium-${{ matrix.shard }}
          path: tests/e2e/blob-report
          if-no-files-found: warn
          retention-days: 3

  e2e-webkit:
    name: WebKit shard ${{ matrix.shard }}/3 (informational)
    needs: [site]
    runs-on: ubuntu-latest
    # WebKit remains informational until its service worker behavior is stable on
    # Linux. A job-level continue-on-error keeps a failure in any shard from
    # failing the workflow run, which scripts/promote-release.py reads. Firefox is
    # disabled in CI after repeated installer timeouts; see docs/decisions.md.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: generated
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      - uses: ./.github/actions/setup-e2e
        with:
          browser: webkit
      - name: Tests on WebKit (informational)
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
        run: >-
          npm --prefix tests/e2e test --
          --project=webkit
          --shard=${{ matrix.shard }}/3
          --reporter=list,github,blob
          --output=test-results/webkit-${{ matrix.shard }}
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-webkit-${{ matrix.shard }}
          path: tests/e2e/blob-report
          if-no-files-found: warn
          retention-days: 3

  # One HTML report per browser, merged from the shard blobs. The blobs carry the
  # traces and screenshots of failed tests. These jobs only publish; they must not
  # decide the run result, so they are informational and a failing shard does not
  # stop them.
  report-chromium:
    name: Chromium report
    needs: [e2e-chromium]
    if: ${{ !cancelled() && needs.e2e-chromium.result != 'skipped' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/merge-e2e-reports
        with:
          browser: chromium

  report-webkit:
    name: WebKit report
    needs: [e2e-webkit]
    if: ${{ !cancelled() && needs.e2e-webkit.result != 'skipped' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/merge-e2e-reports
        with:
          browser: webkit
