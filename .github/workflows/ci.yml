name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          cache-key: check
      - name: Release promotion safety checks
        run: python3 scripts/test-promote-release.py
      - name: cargo xtask check
        run: cargo xtask check

  content:
    name: Content compiler and determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned dataset commits
        id: pin
        run: |
          echo "commit=$(sed -n 's/^commit *= *"\(.*\)"/\1/p' sources/psrd-data/source.toml)" >> "$GITHUB_OUTPUT"
          echo "primary=$(python3 -c 'import json; print(json.load(open("sources/pathfinder-data-1-e/source.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/sources
          key: psrd-data-${{ steps.pin.outputs.commit }}-pf-${{ steps.pin.outputs.primary }}
      - uses: ./.github/actions/setup-build
        with:
          cache-key: content
      - run: cargo xtask fetch-sources
      # The canonical library is the default build (generated/content).
      - run: cargo xtask content
      - name: Hash the first canonical compile
        id: first
        run: echo "hash=$(find generated -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Compile the canonical default again from scratch
        run: |
          rm -rf generated
          cargo xtask content
      - name: Canonical output must be byte-identical (NFR-05)
        run: |
          second=$(find generated -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "first : ${{ steps.first.outputs.hash }}"
          echo "second: $second"
          test "$second" = "${{ steps.first.outputs.hash }}"
      # PSRD-Data is no longer the default, but it remains the carry-over input
      # and the previous published library. Its build must stay deterministic.
      - name: Compile the PSRD carry-over library
        run: cargo xtask content --psrd
      - name: Hash the first PSRD compile
        id: psrd-first
        run: echo "hash=$(find generated/psrd generated/reports/psrd -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Compile the PSRD carry-over library again from scratch
        run: |
          rm -rf generated/psrd generated/reports/psrd
          cargo xtask content --psrd
      - name: PSRD output must be byte-identical
        run: |
          second=$(find generated/psrd generated/reports/psrd -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "first : ${{ steps.psrd-first.outputs.hash }}"
          echo "second: $second"
          test "$second" = "${{ steps.psrd-first.outputs.hash }}"
      - name: The default library resolves every previous PSRD id
        run: python3 scripts/check-library-upgrade.py generated/psrd generated/content
      - name: Audit the complete pinned primary input and representative conversion
        run: |
          cargo xtask data-report
          git diff --exit-code -- reports/migration-coverage.json reports/migration-legal.json reports/migration-test.json reports/migration-test.md
      - uses: actions/upload-artifact@v7
        with:
          name: generated
          path: generated
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: content-reports
          path: generated/reports
          if-no-files-found: error
          retention-days: 30

  site:
    name: Build the site
    # Browser signal must not disappear when formatting, clippy, or unit tests fail.
    needs: [content]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: generated
      - uses: ./.github/actions/setup-build
        with:
          cache-key: site
          trunk: "true"
      - name: Build the site
        run: |
          trunk --version
          # Trunk fetches wasm-bindgen and wasm-opt from GitHub on a cold tools cache.
          for attempt in 1 2 3; do
            cargo xtask build-site --public-url /cast-iron/ && exit 0
            echo "::warning::build-site attempt $attempt failed"
            sleep 10
          done
          exit 1
      - name: Screen the publication scope and attribution
        run: python3 scripts/check-publication.py
      - name: Dist size summary
        run: |
          {
            echo "### dist size"
            echo '```'
            du -sh dist
            du -sh dist/content
            find dist -maxdepth 1 -type f -printf '%s\t%f\n' | sort -rn | head -10
            echo '```'
          } | tee dist-size.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist
            dist-size.txt
          # dist holds .nojekyll, which the browser tests load as published.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e-chromium:
    name: Browser acceptance tests (Chromium, required)
    needs: [site]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: generated
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      - uses: ./.github/actions/setup-e2e
        with:
          browser: chromium
      - name: Tests on Chromium (required)
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/chromium
        run: npm --prefix tests/e2e test -- --project=chromium --project=mobile-chromium --output=test-results/chromium
      - name: Upload the report, traces and dist size
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-chromium
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            dist-size.txt
          if-no-files-found: warn
          retention-days: 14

  e2e-webkit:
    name: Browser acceptance tests (WebKit, informational)
    needs: [site]
    runs-on: ubuntu-latest
    # WebKit remains informational until its service worker behavior is stable on
    # Linux. A job-level continue-on-error keeps a failure here from failing the
    # workflow run, which scripts/promote-release.py reads. Firefox is disabled in
    # CI after repeated installer timeouts; see docs/decisions.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: generated
          path: generated
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: .
      - uses: ./.github/actions/setup-e2e
        with:
          browser: webkit
      - name: Tests on WebKit (informational)
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/webkit
        run: npm --prefix tests/e2e test -- --project=webkit --output=test-results/webkit
      - name: Upload the report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-webkit
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: warn
          retention-days: 14
