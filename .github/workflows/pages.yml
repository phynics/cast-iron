name: Deploy to GitHub Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned dataset commits
        id: pin
        run: |
          echo "commit=$(sed -n 's/^commit *= *"\(.*\)"/\1/p' sources/psrd-data/source.toml)" >> "$GITHUB_OUTPUT"
          echo "primary=$(python3 -c 'import json; print(json.load(open("sources/pathfinder-data-1-e/source.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/sources
          key: psrd-data-${{ steps.pin.outputs.commit }}-pf-${{ steps.pin.outputs.primary }}
      - uses: ./.github/actions/setup-build
        with:
          # Same key as the CI site job, so a release build reuses compiled dependencies.
          cache-key: site
          trunk: "true"
      # build-site fetches both datasets and compiles the canonical default when
      # generated/content is missing.
      - name: Build the site
        run: |
          trunk --version
          # Trunk fetches wasm-bindgen and wasm-opt from GitHub on a cold tools cache.
          for attempt in 1 2 3; do
            cargo xtask build-site --public-url /cast-iron/ && exit 0
            echo "::warning::build-site attempt $attempt failed"
            sleep 10
          done
          exit 1
      - name: Screen the publication scope and attribution
        run: python3 scripts/check-publication.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
