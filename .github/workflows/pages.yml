name: Deploy to GitHub Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRUNK_VERSION: "0.22.1"
  # SHA-256 of trunk-x86_64-unknown-linux-gnu.tar.gz in the v0.22.1 release.
  TRUNK_SHA256: 2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1

jobs:
  build:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned dataset commits
        id: pin
        run: |
          echo "commit=$(sed -n 's/^commit *= *"\(.*\)"/\1/p' sources/psrd-data/source.toml)" >> "$GITHUB_OUTPUT"
          echo "primary=$(python3 -c 'import json; print(json.load(open("sources/pathfinder-data-1-e/source.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/sources
          key: psrd-data-${{ steps.pin.outputs.commit }}-pf-${{ steps.pin.outputs.primary }}
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk ${{ env.TRUNK_VERSION }}
        run: |
          asset="trunk-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/${asset}"
          echo "${TRUNK_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf "$RUNNER_TEMP/$asset" -C "$HOME/.local/bin" trunk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # build-site fetches both datasets and compiles the canonical default when
      # generated/content is missing.
      - name: Build the site
        run: |
          trunk --version
          cargo xtask build-site --public-url /cast-iron/
      - name: Screen the publication scope and attribution
        run: python3 scripts/check-publication.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
