name: Set up the Playwright browser tests
description: >-
  Node with the npm cache and the test dependencies. The browser binary and its
  system libraries come from the Playwright container that the job runs in, so
  this action installs neither.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: tests/e2e/package-lock.json
    - run: npm --prefix tests/e2e ci
      shell: bash
