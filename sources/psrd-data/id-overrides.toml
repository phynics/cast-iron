# Explicit id decisions for the content compiler. See `IdOverrides` in
# crates/content-compiler/src/config.rs for the three tables.
#
# [ids]               upstream url -> entry id. Needed when two urls slugify to the same id.
# [aliases]           entry id -> extra search aliases.
# [equivalent_urls]   upstream href -> the url it should resolve as.
#
# The POC selection needs no [ids] entries. The one equivalent url below fixes an upstream href
# that repeats its own path.
[ids]

[aliases]

[equivalent_urls]
"pfsrd://Bestiary/Monsters/Bat/Dire/Bat/Dire" = "pfsrd://Bestiary/Monsters/Bat/Dire"
