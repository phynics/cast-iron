# Original chapter order of each publication, as a reviewable list.
#
# Chapter sequence is treated as printed order only where supported by evidence recorded in
# docs/research/book-order-evidence.md. Upstream rules-tree order is not proof of print order.
#
# A chapter claims every record whose upstream url equals `url` or lies below it, optionally
# narrowed by entry `kinds` or by a `path` prefix of the upstream file (it tells apart records
# that share a url, such as the Core Rulebook's core, prestige, and NPC classes). The most
# specific claim wins. Entries inside a claimed rules tree follow that tree's order. Typed
# records that no tree contains follow the upstream sibling order in upstream-order.json.
# `review` marks a chapter whose position or content a person must confirm against the book.

version = 1

